<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8f4"><title>Evergreen Planner</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark">✳</span><span>evergreen<span class="brand-light"> planner</span></span></div><div class="workspace-label">YOUR WORKSPACE</div><nav id="navigation" aria-label="Main navigation"></nav><div class="sidebar-bottom"><div class="side-quote"><span>✦</span><p>Small steps, steady growth.</p><small>Your progress is taking root.</small></div><button class="nav-link" data-page="settings"><span>⚙</span> Settings</button><div class="profile"><div class="avatar">S</div><div><strong>Student</strong><small>My planner</small></div><span class="profile-dots">···</span></div></div></aside>
  <main class="main-area"><header class="topbar"><button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button><div class="breadcrumb"><span>My workspace</span><b>/</b><strong id="crumb">Dashboard</strong></div><div class="top-actions"><div class="live-clock"><span class="live-dot"></span><span id="clock"></span></div><button class="icon-button" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">◐</button><button class="icon-button notification-button" id="bell" aria-label="Notifications">♧<i id="notificationDot"></i></button><button class="avatar avatar-small">S</button></div></header><section class="page-content" id="pageContent"></section></main>
</div>
<div class="toast-region" id="toasts" aria-live="polite"></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><div><span class="eyebrow" id="modalEyebrow">QUICK ACTION</span><h2 id="modalTitle">Add task</h2></div><button class="icon-button" data-close aria-label="Close">×</button></header><form id="itemForm"><div id="formFields"></div><footer><button type="button" class="button button-quiet" data-close>Cancel</button><button class="button button-primary" type="submit" id="saveItem">Save</button></footer></form></section></div>
<div class="modal-backdrop hidden" id="focusBackdrop"><section class="modal focus-modal" role="dialog" aria-modal="true"><header><div><span class="eyebrow">FOCUS MODE</span><h2>Make this time yours</h2></div><button class="icon-button" data-close>×</button></header><div class="focus-face"><div class="timer-ring"><div><strong id="timerText">25:00</strong><small id="timerMode">FOCUS SESSION</small></div></div><p id="focusLink">A little progress goes a long way.</p></div><div class="focus-actions"><button class="button button-primary" id="timerStart">Start focus</button><button class="button button-quiet" id="timerReset">Reset</button></div><div class="focus-settings"><label>Focus minutes<input id="focusMinutes" type="number" min="1" max="180" value="25"></label><label>Break minutes<input id="breakMinutes" type="number" min="1" max="60" value="5"></label></div></section></div>
<script src="app.js"></script></body></html>
